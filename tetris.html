<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <title>TETRIS_SECRET.exe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(circle at top,
                    #0a1030 0%,
                    #020308 60%,
                    #000 100%);
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
        }

        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid #00f7ff55;
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 16px;
            min-width: 180px;
        }

        .title {
            font-size: 1.7rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #00f7ff;
            text-shadow:
                0 0 10px #00f7ff,
                0 0 25px #00f7ff;
        }

        .info {
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .paused {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.5);
            color: #00f7ff;
            font-size: 4rem;
            font-weight: bold;
            z-index: 999;
            text-shadow: 0 0 20px #00f7ff;
        }

        .game-over {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
        }

        .game-over h1 {
            color: #ff3366;
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .restart {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            background: #00f7ff;
            color: black;
            font-size: 1rem;
            font-weight: bold;
        }

        .guide {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffffaa;
            font-size: 0.9rem;
            z-index: 100;
            text-align: center;
        }
    </style>
</head>

<body>

    <canvas id="game"></canvas>

    <div class="hud">

        <div class="title">
            TETRIS_SECRET
        </div>

        <div class="info">
            Pontos: <span id="score">0</span>
        </div>

        <div class="info">
            Linhas: <span id="lines">0</span>
        </div>

        <div class="info">
            Nível: <span id="level">1</span>
        </div>

    </div>

    <div class="guide">
        ← → deslize lados | ↓ acelerar | ↑↑ congelar
    </div>

    <div class="paused" id="paused">
        PAUSADO
    </div>

    <div class="game-over" id="gameOver">

        <h1>GAME OVER</h1>

        <button class="restart" onclick="restartGame()">
            REINICIAR
        </button>

    </div>

    <script>

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        const COLS = 10;
        const ROWS = 20;

        let blockSize;

        function resizeCanvas() {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            blockSize = Math.floor(
    Math.min(
        window.innerWidth / 18,
        window.innerHeight / 24
    )
);
        }

        resizeCanvas();

        window.addEventListener('resize', resizeCanvas);

        const arena = createMatrix(COLS, ROWS);

        const colors = [
            null,
            '#00f7ff',
            '#ff00ff',
            '#00ff88',
            '#ffe600',
            '#ff8800',
            '#ff3355',
            '#8888ff'
        ];

        const player = {
            pos: { x: 0, y: 0 },
            matrix: null,
            score: 0,
            lines: 0,
            level: 1
        };

        let paused = false;

        function createMatrix(w, h) {

            const matrix = [];

            while (h--) {
                matrix.push(new Array(w).fill(0));
            }

            return matrix;
        }

        function createPiece(type) {

            if (type === 'T') {
                return [
                    [0,0,0],
                    [1,1,1],
                    [0,1,0]
                ];
            }

            if (type === 'O') {
                return [
                    [2,2],
                    [2,2]
                ];
            }

            if (type === 'L') {
                return [
                    [0,3,0],
                    [0,3,0],
                    [0,3,3]
                ];
            }

            if (type === 'J') {
                return [
                    [0,4,0],
                    [0,4,0],
                    [4,4,0]
                ];
            }

            if (type === 'I') {
                return [
                    [0,5,0,0],
                    [0,5,0,0],
                    [0,5,0,0],
                    [0,5,0,0]
                ];
            }

            if (type === 'S') {
                return [
                    [0,6,6],
                    [6,6,0],
                    [0,0,0]
                ];
            }

            if (type === 'Z') {
                return [
                    [7,7,0],
                    [0,7,7],
                    [0,0,0]
                ];
            }
        }

        function collide(arena, player) {

            const [m, o] = [player.matrix, player.pos];

            for (let y = 0; y < m.length; ++y) {

                for (let x = 0; x < m[y].length; ++x) {

                    if (
                        m[y][x] !== 0 &&
                        (
                            arena[y + o.y] &&
                            arena[y + o.y][x + o.x]
                        ) !== 0
                    ) {
                        return true;
                    }

                }

            }

            return false;
        }

        function merge(arena, player) {

            player.matrix.forEach((row, y) => {

                row.forEach((value, x) => {

                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }

                });

            });

        }

        function rotate(matrix) {

            for (let y = 0; y < matrix.length; ++y) {

                for (let x = 0; x < y; ++x) {

                    [
                        matrix[x][y],
                        matrix[y][x]
                    ] = [
                        matrix[y][x],
                        matrix[x][y]
                    ];

                }

            }

            matrix.forEach(row => row.reverse());

        }

        function rotatePiece() {

            rotate(player.matrix);

            if (collide(arena, player)) {

                rotate(player.matrix);
                rotate(player.matrix);
                rotate(player.matrix);

            }

        }

        function playerReset() {

            const pieces = 'TJLOSZI';

            player.matrix = createPiece(
                pieces[Math.random() * pieces.length | 0]
            );

            player.pos.y = 0;

            player.pos.x =
                (COLS / 2 | 0) -
                (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {

                document.getElementById('gameOver').style.display = 'flex';

            }

        }

        function arenaSweep() {

            let rowCount = 1;

            outer:
            for (let y = arena.length - 1; y > 0; --y) {

                for (let x = 0; x < arena[y].length; ++x) {

                    if (arena[y][x] === 0) {
                        continue outer;
                    }

                }

                const row = arena.splice(y, 1)[0].fill(0);

                arena.unshift(row);

                ++y;

                player.score += rowCount * 100;
                player.lines++;

                rowCount *= 2;

            }

            player.level =
                Math.floor(player.lines / 10) + 1;

        }

        function drawMatrix(matrix, offset) {

            matrix.forEach((row, y) => {

                row.forEach((value, x) => {

                    if (value !== 0) {

                        const px =
                            (x + offset.x) * blockSize;

                        const py =
                            (y + offset.y) * blockSize;

                        ctx.fillStyle = colors[value];

                        ctx.shadowColor = colors[value];
                        ctx.shadowBlur = 20;

                        ctx.fillRect(
                            px,
                            py,
                            blockSize,
                            blockSize
                        );

                        ctx.strokeStyle = '#000';

                        ctx.strokeRect(
                            px,
                            py,
                            blockSize,
                            blockSize
                        );

                    }

                });

            });

        }

        function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // fundo
    ctx.fillStyle = "#050816";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // tamanho real da arena
    const arenaWidth = COLS * blockSize;
    const arenaHeight = ROWS * blockSize;

    // centralização
    const offsetX =
        (canvas.width - arenaWidth) / 2;

    const offsetY =
        (canvas.height - arenaHeight) / 2;

    // fundo da arena
    ctx.fillStyle = "rgba(0,0,0,0.75)";

    ctx.fillRect(
        offsetX,
        offsetY,
        arenaWidth,
        arenaHeight
    );

    // borda neon
    ctx.strokeStyle = "#00f7ff";
    ctx.lineWidth = 4;

    ctx.shadowColor = "#00f7ff";
    ctx.shadowBlur = 20;

    ctx.strokeRect(
        offsetX,
        offsetY,
        arenaWidth,
        arenaHeight
    );

    // grid
    ctx.shadowBlur = 0;

    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;

    for (let x = 0; x <= COLS; x++) {

        ctx.beginPath();

        ctx.moveTo(
            offsetX + x * blockSize,
            offsetY
        );

        ctx.lineTo(
            offsetX + x * blockSize,
            offsetY + arenaHeight
        );

        ctx.stroke();
    }

    for (let y = 0; y <= ROWS; y++) {

        ctx.beginPath();

        ctx.moveTo(
            offsetX,
            offsetY + y * blockSize
        );

        ctx.lineTo(
            offsetX + arenaWidth,
            offsetY + y * blockSize
        );

        ctx.stroke();
    }

    // desenhar arena
    ctx.save();

    ctx.translate(offsetX, offsetY);

    drawMatrix(arena, { x: 0, y: 0 });

    drawMatrix(player.matrix, player.pos);

    ctx.restore();
}
        function updateScore() {

            document.getElementById('score').innerText =
                player.score;

            document.getElementById('lines').innerText =
                player.lines;

            document.getElementById('level').innerText =
                player.level;

        }

        function playerDrop() {

            player.pos.y++;

            if (collide(arena, player)) {

                player.pos.y--;

                merge(arena, player);

                arenaSweep();

                playerReset();

                updateScore();

            }

            dropCounter = 0;
        }

        function move(dir) {

            player.pos.x += dir;

            if (collide(arena, player)) {
                player.pos.x -= dir;
            }

        }

        let dropCounter = 0;
        let lastTime = 0;

        function update(time = 0) {

            if (!paused) {

                const deltaTime = time - lastTime;

                lastTime = time;

                dropCounter += deltaTime;

                const speed =
                    Math.max(
                        120,
                        1000 - ((player.level - 1) * 80)
                    );

                if (dropCounter > speed) {
                    playerDrop();
                }

                draw();

            }

            requestAnimationFrame(update);

        }

        document.addEventListener('keydown', e => {

            if (e.key === 'ArrowLeft') {
                move(-1);
            }

            else if (e.key === 'ArrowRight') {
                move(1);
            }

            else if (e.key === 'ArrowDown') {
                playerDrop();
            }

            else if (e.key === 'ArrowUp') {
                rotatePiece();
            }

        });

        let touchStartX = 0;
        let touchStartY = 0;
        let lastUpSwipe = 0;

        document.addEventListener('touchstart', e => {

            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;

        });

        document.addEventListener('touchend', e => {

            const touchEndX =
                e.changedTouches[0].clientX;

            const touchEndY =
                e.changedTouches[0].clientY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {

                if (paused) {
                    paused = false;
                    document.getElementById('paused').style.display = 'none';
                    return;
                }

                if (dx > 40) {
                    move(1);
                }

                else if (dx < -40) {
                    move(-1);
                }

            }

            else {

                if (dy > 40) {

                    if (paused) {
                        paused = false;
                        document.getElementById('paused').style.display = 'none';
                        return;
                    }

                    playerDrop();

                }

                else if (dy < -40) {

                    const now = Date.now();

                    if (now - lastUpSwipe < 400) {

                        paused = !paused;

                        document.getElementById('paused').style.display =
                            paused ? 'flex' : 'none';

                    }

                    else {

                        if (!paused) {
                            rotatePiece();
                        }

                    }

                    lastUpSwipe = now;

                }

            }

        });

        function restartGame() {

            arena.forEach(row => row.fill(0));

            player.score = 0;
            player.lines = 0;
            player.level = 1;

            document.getElementById('gameOver').style.display = 'none';

            updateScore();

            playerReset();

        }

        playerReset();
        updateScore();
        update();

    </script>

</body>

</html>
